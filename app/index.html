<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vista de la Rosa Jarabacoa</title>
    <link rel="icon" type="image/png" href="/villa.PNG" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script>
      (function (l) {
        if (l.search && l.search.startsWith("?/") && l.search.length > 2) {
          var decoded = l.search
            .slice(2)
            .replace(/~and~/g, "&")
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("&");
          var nextPath = "/" + decoded;
          var nextSearch = "";
          var parts = decoded.split("?");
          if (parts.length > 1) {
            nextPath = "/" + parts[0];
            nextSearch = "?" + parts.slice(1).join("?");
          }
          window.history.replaceState(
            null,
            null,
            nextPath + nextSearch + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
