    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../public/villa.PNG" />

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../css/shared.css" />

  <body>
    <!-- Header / Navegación -->
    <nav

    >
      <div class="container">
        <a class="navbar-brand fw-semibold brand" href="index.html">
          <img
            src="../public/villa.PNG"
            alt="Vista de la Rosa logo"
            class="brand-logo me-2"
            width="32"
            height="32"
            decoding="async"
          />
          Vista de la Rosa
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Inicio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="villas.html">Villas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="ubicacion.html">Ubicación</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header
      id="inicio"
      class="hero position-relative d-flex align-items-center"
    >
      <div class="hero-video">
        <div class="ratio ratio-16x9">
          <iframe
            src="https://www.youtube.com/embed/EXqYxY8lBvI?rel=0&modestbranding=1"
            title="Video introductorio Vista de la Rosa"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <!-- COMENTARIO: Puedes reemplazar la imagen de fondo del hero en styles.css o estableciendo un style inline con tu imagen real -->
      <div
        class="hero-overlay position-absolute top-0 start-0 w-100 h-100"
      ></div>
      <div class="container position-relative text-center text-white">
        <h1 class="display-4 display-md-3 fw-bold hero-title">
          Tu escape perfecto en las montañas
        </h1>
        <p class="lead opacity-75 mb-4">
          Villas privadas con amenidades premium en Jarabacoa
        </p>
        <a href="villas.html" class="btn btn-primary btn-lg shadow-sm"
          >Reserva tu Villa</a
        >
        <p class="mt-3 mb-0">
          <a
            href="https://youtu.be/EXqYxY8lBvI"
            target="_blank"
            rel="noopener"
            class="text-cream-80 text-decoration-underline small"
          >
            Ver video de introducción en YouTube
          </a>
        </p>
      </div>

    <!-- Servicios movidos a pages/servicios.html -->
    <!-- Ubicación movida a pages/ubicacion.html -->

    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App JS -->
    <script src="../script.js"></script>
    <!-- Footer Include -->
    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
          if (typeof setupPageTransitions === "function") {
            setupPageTransitions();
          }
        });
    </script>
